name: SourceMod Build

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    paths:
      - .github/workflows/sourcemod-build.yml
      - Makefile
      - plugin-package-map.json
      - scripts/fetch-sourcemod.py
      - scripts/build-local.py
      - scripts/stage-artifact.py
      - scripts/package-release.py
      - scripts/ci-validate-artifact.sh
      - addons/sourcemod/**
      - Changelog
      - README.md
      - docs/**
  workflow_dispatch:
    inputs:
      sourcemod_version:
        description: SourceMod version to download
        required: false
        default: "1.12"

concurrency:
  group: sourcemod-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SOURCEMOD_VERSION: ${{ inputs.sourcemod_version || '1.12' }}

jobs:
  deps-smx:
    runs-on: ubuntu-24.04
    outputs:
      cache-key: ${{ steps.cache-key.outputs.key }}

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes python3 make

      - name: Validate workflow syntax
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9

      - name: Resolve dependency cache key
        id: cache-key
        shell: bash
        run: |
          echo "key=smx-deps-${{ runner.os }}-${{ env.SOURCEMOD_VERSION }}-${{ hashFiles('scripts/fetch-sourcemod.py', 'scripts/build-local.py', 'scripts/stage-artifact.py', 'scripts/package-release.py', 'plugin-package-map.json', 'Makefile') }}" >> "$GITHUB_OUTPUT"

      - name: Restore SourceMod dependency cache
        id: deps-cache-restore
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: deps
          key: ${{ steps.cache-key.outputs.key }}

      - name: Resolve SourceMod dependencies
        if: steps.deps-cache-restore.outputs.cache-hit != 'true'
        run: make deps-smx PYTHON=python3 SOURCEMOD_VERSION="${SOURCEMOD_VERSION}" SMX_PLATFORM=linux

      - name: Save SourceMod dependency cache
        if: steps.deps-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: deps
          key: ${{ steps.cache-key.outputs.key }}

  build-smx:
    needs: deps-smx
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes python3 make

      - name: Restore SourceMod dependency cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: deps
          key: ${{ needs.deps-smx.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Build SourceMod plugin
        run: make build-smx PYTHON=python3 SPCOMP="deps/sourcemod-linux/addons/sourcemod/scripting/spcomp"

      - name: Upload SourceMod build tree
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: smx-build
          path: .build/smx
          if-no-files-found: error
          retention-days: 1

      - name: Upload SourceMod compile log
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: smx-compile-log
          path: deps/build-smx-compile.log
          if-no-files-found: error
          retention-days: 1

  package:
    needs: build-smx
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes python3 make

      - name: Download SourceMod build tree
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: smx-build
          path: .build/smx

      - name: Download SourceMod compile log
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: smx-compile-log
          path: deps

      - name: Resolve artifact metadata
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" == "develop" ]]; then
            version="develop-sha-${GITHUB_SHA}"
            channel_tag="channel/develop"
            channel_basename="little-anti-cheat-develop"
            channel_name="Develop"
          elif [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            version="main-sha-${GITHUB_SHA}"
            channel_tag="channel/latest"
            channel_basename="little-anti-cheat-latest"
            channel_name="Latest"
          else
            version="pr-${GITHUB_SHA}"
            channel_tag=""
            channel_basename=""
            channel_name=""
          fi

          {
            echo "version=${version}"
            echo "basename=little-anti-cheat-${version}"
            echo "channel_tag=${channel_tag}"
            echo "channel_basename=${channel_basename}"
            echo "channel_name=${channel_name}"
          } >> "$GITHUB_OUTPUT"

      - name: Package SourceMod build tree
        run: make package-smx PYTHON=python3

      - name: Stage SourceMod artifact
        run: python3 ./scripts/stage-artifact.py . ./.build/package-smx ./deps/build-smx-compile.log

      - name: Validate SourceMod artifact
        run: bash ./scripts/ci-validate-artifact.sh

      - name: Create release archive
        env:
          RELEASE_BASENAME: ${{ steps.meta.outputs.basename }}
        run: make release PYTHON=python3 RELEASE_BASENAME="${RELEASE_BASENAME}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: ${{ steps.meta.outputs.basename }}
          path: dist/release/${{ steps.meta.outputs.basename }}.zip
          if-no-files-found: error
          retention-days: 14

      - name: Prepare rolling channel asset
        if: github.event_name == 'push' && steps.meta.outputs.channel_tag != ''
        shell: bash
        run: |
          cp \
            "dist/release/${{ steps.meta.outputs.basename }}.zip" \
            "dist/release/${{ steps.meta.outputs.channel_basename }}.zip"

      - name: Publish rolling channel
        if: github.event_name == 'push' && steps.meta.outputs.channel_tag != ''
        uses: softprops/action-gh-release@5113cdc90fd4d541c801c55356214017bf5ae34b
        with:
          tag_name: ${{ steps.meta.outputs.channel_tag }}
          name: ${{ steps.meta.outputs.channel_name }}
          target_commitish: ${{ github.sha }}
          files: dist/release/${{ steps.meta.outputs.channel_basename }}.zip
          overwrite_files: true
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          make_latest: false

      - name: Advance rolling channel tag
        if: github.event_name == 'push' && steps.meta.outputs.channel_tag != ''
        shell: bash
        run: |
          git tag --force "${{ steps.meta.outputs.channel_tag }}" "$GITHUB_SHA"
          git push --force origin "refs/tags/${{ steps.meta.outputs.channel_tag }}"
